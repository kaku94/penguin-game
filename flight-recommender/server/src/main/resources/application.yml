spring:
  application:
    name: flight-recommender
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:flightrec.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite는 쓰기 잠금이 DB 단위라 커넥션 하나로 직렬화한다
      maximum-pool-size: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    parse-model: claude-opus-5-5
    search-model: claude-opus-5-5
    # 거절(refusal) 시 서버 측 자동 폴백. Claude Opus 5.5 / Sonnet 5.5 / Fable 5.1 에서만 지원
    fallbacks-enabled: true
    # 비용 추정용 단가 (USD). 실제 단가는 Anthropic 가격표로 확인
    input-price-per-mtok: 4.0
    output-price-per-mtok: 20.0
    web-search-price: 0.01
  search:
    max-web-searches: 8
    max-cities: 3
    max-date-pairs: 8
    max-results: 5
    timeout: 55s
    cache-ttl: 6h
    price-weight: 0.6
    time-weight: 0.4
    # 약 1만원. 넘으면 그 달은 검색 중단
    monthly-budget-usd: 7.0
  cors:
    allowed-origins:
      - http://localhost:5173
  # 앱 시작 시 없으면 생성. 지인 공유용 코드는 여기에 추가
  invite-codes:
    - code: dev-local
      name: 개발용
      daily-limit: 20
